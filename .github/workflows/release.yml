name: Release

on:
  pull_request:
    paths:
      - .goreleaser.yaml
      - .github/workflows/release.yml
      - go.mod
      - go.sum
      - cmd/**
      - internal/**
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  smoke:
    name: Native smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check Git dependency
        run: git --version
      - name: Compile and start the CLI
        run: |
          go run ./cmd/awl --version
          go run ./cmd/awl --help
      - name: Verify Windows file locking
        if: matrix.os == 'windows-latest'
        run: go test -run TestWindowsFileLockSerializesAccess -count=1 ./internal/awl

  package-check:
    name: Package snapshot (no publication)
    if: github.event_name == 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
